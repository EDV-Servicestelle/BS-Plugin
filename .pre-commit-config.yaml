# Lokale Prüfungen vor jedem Commit.
# Einrichten:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        name: Große Dateien abfangen
        args: [--maxkb=5120]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203]
        files: ^(qgis_plugin|tools)/

  # Stile/Referenzlisten im GeoPackage gegen die Textfassung im Repository
  # prüfen - dieselbe Prüfung wie der CI-Job "quellen-synchron", nur früher.
  # Bewusst nur prüfend: ein Hook, der still Dateien ändert, verbirgt den Diff.
  - repo: local
    hooks:
      - id: quellen-synchron
        name: Stile und Referenzlisten synchron
        entry: python tools/export_from_gpkg.py --plugin qgis_plugin --out . --pruefen
        language: system
        pass_filenames: false
        files: ^(qgis_plugin/data/|styles/|reflists/|datamodel/)
