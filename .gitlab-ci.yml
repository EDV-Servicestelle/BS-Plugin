# CI für das QGIS-/QField-Plugin "Fundpunkte Tiere"
#
# Die Stufen sind bewusst klein gehalten und laufen ohne QGIS-Installation.
# Alles, was eine laufende QGIS-Instanz braucht, bleibt manuellem Test
# vorbehalten.

stages:
  - pruefen
  - bauen

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --quiet --upgrade pip

# ── 1. Keine Zugangsdaten im Repository ─────────────────────────────────────
# Wichtigster Job: Das Repository wird spaeter oeffentlich gespiegelt. Ein
# einmal gepushtes Geheimnis bleibt ueber die Historie abrufbar, auch wenn es
# im naechsten Commit entfernt wird.
geheimnisse:
  stage: pruefen
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks detect --source . --no-banner --redact --verbose
  allow_failure: false

# ── 2. Syntax und Stil (Leistungsbeschreibung §6: PEP 8) ────────────────────
codestil:
  stage: pruefen
  script:
    - pip install --quiet flake8
    # Syntaxfehler und undefinierte Namen sind harte Fehler
    - flake8 qgis_plugin tools --count --select=E9,F63,F7,F82 --show-source
    # Stilabweichungen werden berichtet, brechen den Build aber nicht ab
    - flake8 qgis_plugin tools --count --max-line-length=100 --exit-zero
      --statistics

# ── 3. Textquellen stimmen mit den GeoPackages überein ──────────────────────
# Fängt genau den Fehlertyp ab, der in der Vergangenheit mehrfach aufgetreten
# ist: Stil bzw. Referenzliste im GeoPackage geändert, die Textfassung im
# Repository aber nicht nachgezogen (oder umgekehrt).
quellen-synchron:
  stage: pruefen
  script:
    - python3 tools/export_from_gpkg.py --plugin qgis_plugin --out . --pruefen

# ── 4. Plugin-Paket bauen ───────────────────────────────────────────────────
paket:
  stage: bauen
  script:
    - pip install --quiet odfpy
    - mkdir -p dist
    - python3 tools/build_plugin_zip.py --plugin qgis_plugin --out dist
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 4 weeks
